# version: '3.8'

services:
  web:
    container_name: djangoweb
    build: .
    command: /djangoweb/scripts/entrypoint.sh
    ports:
      - "80:8000"
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - sisacdc-network

  celery:
    container_name: celery
    build: .
    command: celery -A core worker --loglevel=info --concurrency=8 --max-tasks-per-child=50
    env_file:
      - .env
    depends_on:
      - redis
      - web
    volumes:
      - .:/djangoweb
    restart: on-failure
    networks:
      - sisacdc-network

  celery_beat:
    container_name: celery_beat
    build: .
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      - redis
      - web
    volumes:
      - .:/djangoweb
    restart: on-failure
    networks:
      - sisacdc-network

  redis:
    container_name: redis
    image: redis:7.2.4-alpine
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - sisacdc-network

volumes:
  redis-data:

networks:
  sisacdc-network:
    driver: bridge