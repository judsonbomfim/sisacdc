# version: '3.8'

services:
  web:
    container_name: djangoapp
    image: djangoweb:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: /djangoweb/entrypoint.sh
    networks:
      - public
      - internal
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - IMAGE_NAME=djangoweb:latest
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - logs:/djangoweb/logs
      - /home/sprdmntrdr/docker/django/.env:/djangoweb/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/health/'); req.add_header('Host', 'painel.acasadochip.com'); urllib.request.urlopen(req, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=public"
      - "traefik.http.routers.django-http.rule=Host(`painel.acasadochip.com`)"
      - "traefik.http.routers.django-http.entrypoints=web"
      - "traefik.http.routers.django-http.middlewares=https-redirect"
      - "traefik.http.routers.django-https.rule=Host(`painel.acasadochip.com`)"
      - "traefik.http.routers.django-https.entrypoints=websecure"
      - "traefik.http.routers.django-https.tls=true"
      - "traefik.http.routers.django-https.tls.certresolver=leresolver"
      - "traefik.http.services.django.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
    restart: unless-stopped

  celery:
    container_name: celery
    image: djangoweb:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    networks:
      - internal
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - logs:/djangoweb/logs
      - /home/sprdmntrdr/docker/django/.env:/djangoweb/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped

  celery_beat:
    container_name: celery_beat
    image: djangoweb:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - internal
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - logs:/djangoweb/logs
      - /home/sprdmntrdr/docker/django/.env:/djangoweb/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    
  redis:
    container_name: redis
    image: redis:7.2.4-alpine
    networks:
      - internal
    volumes:
      - redis-data:/data
      - ./redis.conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  public:
    name: public
    driver: bridge
  internal:
    driver: bridge

volumes:
  redis-data:
    driver: local
  logs:
    driver: local

