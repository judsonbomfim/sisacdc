{% extends 'painel/partials/_content_default.html' %}
{% load static %}
{% load date_day %}
{% block title_page %}<i class="bi bi-sim" style="font-size: 1.2em;"></i> SIMs{% endblock %}
{% block title_content %}Adicionar eSIMs{% endblock %}

{% block content_def %}
<form action="{% url 'sims_add_esim' %}" method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <label class="form-label">Tipo de Chip</label>
    <div class="radio-horizontal-list d-flex">
        <input type="radio" class="btn-check" name="type_sim" id="type_sim1" value="sim" autocomplete="off" disabled>
        <label class="btn btn-outline-primary me-2" for="type_sim1">SIM Físico</label>

        <input type="radio" class="btn-check" name="type_sim" id="type_sim2" value="esim" autocomplete="off" checked>
        <label class="btn btn-outline-primary me-2" for="type_sim2">eSIM Virtual</label>
    </div>

    <label class="form-label">Operadora</label>
    <div class="radio-horizontal-list d-flex">
        <input type="radio" class="btn-check" name="operator" id="operator1" value="TM" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator1">T-mobile</label>

        <input type="radio" class="btn-check" name="operator" id="operator2" value="CM" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator2">China Mobile</label>

        <input type="radio" class="btn-check" name="operator" id="operator3" value="TC" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator3">Telcom</label>

        <input type="radio" class="btn-check" name="operator" id="operator4" value="TI" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator4">Telcom IMSI</label>

        <input type="radio" class="btn-check" name="operator" id="operator5" value="MS" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator5">MoviStar</label>

        <input type="radio" class="btn-check" name="operator" id="operator6" value="OR20" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator6">Orange 20GB</label>

        <input type="radio" class="btn-check" name="operator" id="operator7" value="OR50" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator7">Orange 50GB</label>

        <input type="radio" class="btn-check" name="operator" id="operator8" value="ORWD" autocomplete="off" required>
        <label class="btn btn-outline-primary me-2" for="operator8">Orange World</label>
    </div>
    <div class="form-group">
        <label for="formFile" class="form-label">Enviar planilha CSV</label>
        <input class="form-control" type="file" id="formFile" name="esim" accept=".csv,text/csv" required>
        <small class="form-text text-muted">A planilha deve conter as colunas lpa e sim ou iccid.</small>
    </div>
    <div class="form-group mt-5">
        <button type="submit" class="btn btn-default btn-rounded color-primary btn-primary">
            <span class="flex items-center">
                <i class="bi bi-sim"></i> <span>Cadastrar SIMs</span>
            </span>
        </button>
    </div>

</form>

{% endblock %}
